open-link-in-target-preference = "in-app-browser"
codeFontSize = 16
avatar-overlay-mascot-width-px = 97
selected-avatar-id = "fireball"
reduced-motion-preference = "system"
browser-show-full-url = true
keepRemoteControlAwakeWhilePluggedIn = false

[desktop.appearanceLightChromeTheme]
