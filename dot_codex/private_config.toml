[mcp_servers.godoc]
command = "godoc-mcp"
args = ["-transport=stdio"]

[mcp_servers.github]
command = "github-mcp-server"
args = ["stdio", "--read-only"]

[mcp_servers.github.env]
GITHUB_LOCKDOWN_MODE = "0"
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_API_KEY}"

[mcp_servers.terraform]
command = "terraform-mcp-server"
args = ["stdio"]

[mcp_servers.terraform.env]
ENABLE_TF_OPERATIONS = "false"
TFE_ADDRESS = ""

[mcp_servers.opentofu]
url = "https://mcp.opentofu.org/mcp"

[mcp_servers."aws-knowledge-mcp-server"]
url = "https://knowledge-mcp.global.api.aws"

[mcp_servers."aws-documentation-mcp-server"]
command = "uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]

[mcp_servers."aws-documentation-mcp-server".env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.mdn]
url = "https://mcp.mdn.mozilla.net/"

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/p00/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/p00/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.1007.21434"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/p00/.codex/plugins/cache/openai-bundled/browser/26.1007.21434/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

# Set CONTEXT7_API_KEY in the environment before starting Codex.
bearer_token_env_var = "CONTEXT7_API_KEY"

[mcp_servers.firefox-devtools]
command = "firefox-devtools-mcp"
args = ["--connect-existing"]

[mcp_servers.chrome-devtools]
command = "chrome-devtools-mcp"
