[tui]
status_line = ["current-dir", "model", "reasoning", "git-branch", "pull-request-number", "branch-changes", "run-state", "approval-mode", "context-used", "context-window-size", "used-tokens", "total-input-tokens", "total-output-tokens", "task-progress", "weekly-limit", "estimated-thread-cost"]
