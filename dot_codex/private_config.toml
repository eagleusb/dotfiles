#:schema https://developers.openai.com/codex/config-schema.json

# Core model selection
model_provider = "openai"
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
model_verbosity = "low"

# Sandbox
sandbox_mode = "workspace-write"
service_tier = "default"

[sandbox_workspace_write]
writable_roots = [
  "~/.codex/",
  "~/Documents/code/",
  "~/.cache/flox/process/",
  "/tmp"
]
network_access = true

[model_providers.openaidr]
name = "OpenAI Data Residency"
base_url = "https://eu.api.openai.com/v1"
wire_api = "responses"

[model_providers.zai]
name = "z.ai coding plan"
# base_url = "https://api.z.ai/api/paas/v4"
base_url = "https://api.z.ai/api/v1"
wire_api = "responses"
env_key = "ZAI_API_KEY"

[model_providers.cerebras]
name = "Cerebras"
base_url = "https://api.cerebras.ai/v1"
env_key = "CEREBRAS_API_KEY"

[features]
hooks = true
# Enable Codex-generated git commits (without attribution trailers)
codex_git_commit = true
memories = true
# fast_mode, multi_agent, personality, shell_snapshot, and shell_tool
# are all stable defaults (true) in Codex 0.151+; omitted for clarity.

[history]
persistence = "save-all"
max_bytes = 104857600 # 100 MiB

[analytics]
enabled = false

[feedback]
enabled = false

